{% set name = "jupyter-ai-acp-client" %}
{% set version = "0.1.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-','_') }}-{{ version }}.tar.gz
  sha256: c53a06a0df635678e8c8faa6008e047737ed93ccfeca7e341b5ed995a65a1d8e

build:
  number: 0
  skip: true  # [py<310]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python
    - pip
    - hatchling >=1.5.0
    - jupyterlab >=4.0.0,<5
    - hatch-nodejs-version >=0.3.2
    - hatch-jupyter-builder >=0.5
  run:
    - python
    - jupyter_server >=2.4.0,<3
    - jupyter-ai-persona-manager >=0.0.9
    - jupyterlab-chat >=0.20.0
    - agent-client-protocol >=0.9.0,<0.10.0
    - pydantic >=2,<3
  run_constrained:
    - jupyterlab >=4.0.0,<5

test:
  imports:
    - jupyter_ai_acp_client
  requires:
    - pip
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"

about:
  home: https://github.com/jupyter-ai-contrib/jupyter-ai-acp-client
  summary: The ACP client implementation in Jupyter AI
  description: |
    A proof-of-concept package providing a client implementation of the
    Agent Client Protocol (ACP) in Jupyter AI v3, as well as helper classes
    for other developers to use when custom AI personas wrapping ACP agents.
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  dev_url: https://github.com/jupyter-ai-contrib/jupyter-ai-acp-client
  doc_url: https://jupyter-ai.readthedocs.io

extra:
  recipe-maintainers:
    - dlqqq
    - andrii-i
